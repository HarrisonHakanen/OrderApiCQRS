server:
  port: 8081

spring:
  application:
    name: OrderApiInsert

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/ordersys}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
