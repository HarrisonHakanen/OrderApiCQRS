server:
  port: 8091

spring:
  application:
    name: OrderApiRead

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/ordersys_read}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.flywaydb: DEBUG